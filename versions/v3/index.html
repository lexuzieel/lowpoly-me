<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Low-poly me</title>
<style>
  :root {
    --bg: #07080b;
    --fg: #cfd3dc;
    --card-w: min(380px, calc(100vw - 32px));
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body {
    display: grid; place-items: center;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--fg);
  }
  #backdrop {
    position: fixed; inset: -40px;
    background: url(bg.jpg) center / cover;
    filter: blur(28px) brightness(.45) saturate(1.2);
    transform: scale(1.1);
  }
  #stage { perspective: 1000px; position: relative; }
  #card {
    width: var(--card-w); aspect-ratio: 2 / 3;
    border-radius: 18px; overflow: hidden; position: relative; cursor: pointer;
    background: radial-gradient(120% 80% at 50% 20%, #1b2233 0%, #0b0d14 70%);
    box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.08) inset;
    will-change: transform;
    user-select: none; -webkit-user-select: none;
  }
  #card canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    image-rendering: pixelated;
  }
  #glare {
    position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen;
    background: radial-gradient(60% 45% at var(--gx, 50%) var(--gy, 30%), rgba(255,255,255,.14), transparent 70%);
  }
  #label {
    position: absolute; left: 16px; right: 16px; bottom: 14px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    pointer-events: none;
  }
  #label span { opacity: .7; }
  #play {
    position: absolute; left: 50%; bottom: 44px; translate: -50% 0;
    width: 64px; height: 64px; border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(10,12,18,.55); border: 1px solid rgba(255,255,255,.25);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: opacity .3s, scale .3s; pointer-events: none;
  }
  #play svg { width: 22px; height: 22px; margin-left: 4px; fill: var(--fg); }
  #card.playing #play { opacity: 0; scale: .8; }
  #card:not(.playing):hover #play { scale: 1.06; }
  #lyric {
    position: absolute; left: 16px; right: 16px; top: 16px; text-align: center;
    font-size: 12px; line-height: 1.4; min-height: 1.4em; opacity: .85;
    text-shadow: 0 1px 2px #000; pointer-events: none;
  }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="backdrop"></div>
<div id="stage">
  <div id="card">
    <div id="glare"></div>
    <div id="lyric"></div>
    <div id="play"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></div>
    <div id="label"><span>low-poly me</span><span id="fps"></span></div>
  </div>
</div>
<audio id="song" src="song.mp3" preload="auto"></audio>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const BODY_FPS = 6;       // stop-motion step rate for body and head
const FACE_FPS = 12;      // mouth and eyes "on twos"
const LOW_RES = 260;      // internal render height, PS1-ish
const card = document.getElementById("card");
const song = document.getElementById("song");
const lyricEl = document.getElementById("lyric");
document.getElementById("fps").textContent = `${BODY_FPS}/${FACE_FPS} fps`;

const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
renderer.setPixelRatio(1);
card.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 2 / 3, 0.05, 20);

// --- PS1 vertex snapping: quantize clip-space positions to a coarse grid ---
const snapRes = { value: new THREE.Vector2(1, 1) };
function ps1Material(params) {
  const m = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide, ...params });
  m.onBeforeCompile = (sh) => {
    sh.uniforms.snapRes = snapRes;
    sh.vertexShader = "uniform vec2 snapRes;\n" + sh.vertexShader.replace(
      "#include <project_vertex>",
      `#include <project_vertex>
       gl_Position.xy = floor(gl_Position.xy / gl_Position.w * snapRes + 0.5) / snapRes * gl_Position.w;`);
  };
  return m;
}

const texLoader = new THREE.TextureLoader();
function tex(name) {
  const t = texLoader.load(`tex_${name}.jpg`);
  t.colorSpace = THREE.SRGBColorSpace;
  t.magFilter = THREE.NearestFilter;
  t.minFilter = THREE.NearestFilter;
  t.generateMipmaps = false;
  t.flipY = false;
  return t;
}
const MATERIALS = {
  face: () => ps1Material({ map: tex("face") }),
  skull: () => ps1Material({ map: tex("face") }),
  beanie: () => ps1Material({ map: tex("beanie") }),
  clothes: () => ps1Material({ map: tex("clothes") }),
  hood: () => ps1Material({ map: tex("clothes") }),
  arm: () => ps1Material({ map: tex("clothes") }),
  hand: () => ps1Material({ map: tex("hand") }),
  eye_L: () => ps1Material({ map: tex("eyes") }),
  eye_R: () => ps1Material({ map: tex("eyes") }),
  mouth_in: () => ps1Material({ color: 0x170406 }),
  teeth: () => ps1Material({ color: 0xb9ad99 }),
};

// --- snow: falls in steps too ---
const SNOW = 140;
const snowGeo = new THREE.BufferGeometry();
const snowPos = new Float32Array(SNOW * 3);
const rnd = (a, b) => a + Math.random() * (b - a);
for (let i = 0; i < SNOW; i++) snowPos.set([rnd(-0.6, 0.6), rnd(0, 1.2), rnd(-0.5, 0.25)], i * 3);
snowGeo.setAttribute("position", new THREE.BufferAttribute(snowPos, 3));
scene.add(new THREE.Points(snowGeo, new THREE.PointsMaterial({ color: 0xdde6ff, size: 3, sizeAttenuation: false })));

// --- character: skinned mesh driven by bones ---
const rig = {};
const BONES = ["b_chest", "b_neck", "b_head", "b_eye_L", "b_eye_R", "b_forearm", "b_hand"];
new GLTFLoader().load("me.glb", (gltf) => {
  const root = gltf.scene;
  root.traverse((o) => {
    if (!o.isMesh) return;
    o.material = (MATERIALS[o.name] || MATERIALS.face)();
    o.frustumCulled = false;  // skinned bounds are stale once bones move
  });
  scene.add(root);
  root.updateMatrixWorld(true);

  // frame on hood + chest; the forearm runs out of the shot on purpose
  const box = new THREE.Box3().setFromObject(root.getObjectByName("hood"));
  box.expandByObject(root.getObjectByName("hand"));
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());

  rig.bones = {};
  rig.rest = {};
  for (const n of BONES) {
    const bn = root.getObjectByName(n);
    rig.bones[n] = bn;
    rig.rest[n] = bn.quaternion.clone();
  }
  rig.face = root.getObjectByName("face");
  rig.morph = rig.face.morphTargetDictionary;
  rig.root = root;
  rig.target = new THREE.Vector3(center.x, center.y + size.y * 0.03, center.z);
  rig.dist = size.y * 2.25;
});

// rotate a bone by an euler given in world axes (x = nod, y = turn, z = tilt), on top of its rest pose
const _pq = new THREE.Quaternion(), _dq = new THREE.Quaternion(), _e = new THREE.Euler();
function poseBone(name, x = 0, y = 0, z = 0) {
  const bn = rig.bones[name];
  bn.parent.updateWorldMatrix(true, false);
  bn.parent.getWorldQuaternion(_pq);
  _dq.setFromEuler(_e.set(x, y, z));
  // local = P^-1 * delta * P * rest
  bn.quaternion.copy(_pq).invert().multiply(_dq).multiply(_pq).multiply(rig.rest[name]);
}

function setMorph(name, v) {
  const i = rig.morph?.[name];
  if (i !== undefined) rig.face.morphTargetInfluences[i] = v;
}

// --- lip sync: baked visemes (from the separated vocal) + lyrics timing ---
let lips = null;
fetch("lipsync.json").then((r) => r.ok ? r.json() : null).then((d) => { lips = d; }).catch(() => {});

card.addEventListener("click", () => {
  if (song.paused) { song.play(); card.classList.add("playing"); }
  else { song.pause(); card.classList.remove("playing"); }
});
song.addEventListener("ended", () => { card.classList.remove("playing"); lyricEl.textContent = ""; });

// --- cursor tilt (smooth) ---
const tilt = { x: 0, y: 0, tx: 0, ty: 0 };
addEventListener("pointermove", (e) => {
  tilt.tx = (e.clientX / innerWidth - 0.5) * 2;
  tilt.ty = (e.clientY / innerHeight - 0.5) * 2;
});
document.addEventListener("pointerleave", () => { tilt.tx = tilt.ty = 0; });

function resize() {
  const r = card.getBoundingClientRect();
  const h = LOW_RES, w = Math.round(LOW_RES * r.width / r.height);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  snapRes.value.set(w / 2, h / 2);
}
addEventListener("resize", resize);
resize();

// deterministic per-step noise, so every "frame" of the stop-motion holds still
function hash(n) { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); }
const jit = (step, k, amp) => (hash(step * 13.7 + k) - 0.5) * 2 * amp;

let lastBody = -1, lastFace = -1, blinkUntil = 0, nextBlink = 2;
const tmpV = new THREE.Vector3(), tmpQ = new THREE.Quaternion(), tmpM = new THREE.Matrix4();

// key poses for pose-to-pose stop motion: [head xyz, neck xyz, chest z, hand z, forearm x]
const POSES = [
  { head: [0.05, 0.25, 0.10], neck: [0.02, 0.10, 0.03], chest: 0.02, hand: 0.25, arm: 0.05 },
  { head: [-0.08, -0.20, -0.12], neck: [0.00, -0.12, -0.04], chest: -0.03, hand: -0.20, arm: -0.05 },
  { head: [0.15, 0.05, 0.18], neck: [0.06, 0.02, 0.05], chest: 0.03, hand: 0.45, arm: 0.12 },
  { head: [-0.02, 0.35, -0.08], neck: [0.00, 0.14, -0.02], chest: 0.00, hand: 0.05, arm: -0.10 },
  { head: [0.10, -0.30, 0.05], neck: [0.04, -0.10, 0.02], chest: -0.02, hand: -0.35, arm: 0.08 },
  { head: [-0.12, 0.00, 0.22], neck: [-0.03, 0.00, 0.08], chest: 0.04, hand: 0.30, arm: 0.00 },
];
const IDLE_POSES = [
  { head: [0.02, 0.10, 0.05], neck: [0, 0.04, 0.01], chest: 0.01, hand: 0.10, arm: 0 },
  { head: [-0.03, -0.08, -0.04], neck: [0, -0.03, -0.01], chest: -0.01, hand: -0.05, arm: 0.03 },
  { head: [0.04, 0.02, 0.08], neck: [0.01, 0.01, 0.02], chest: 0.0, hand: 0.18, arm: -0.02 },
];

function stepBody(step, ts, singing, beat) {
  // hold a key pose, jump to the next one on each beat (singing) or every ~1.3s (idle)
  const idx = singing ? Math.floor(beat) : Math.floor(ts / 1.3);
  const set = singing ? POSES : IDLE_POSES;
  const pose = set[Math.floor(hash(idx * 7.3) * set.length)];
  // accent: the step right on a beat overshoots, like a hit
  const onHit = singing && beat - Math.floor(beat) < 1 / (BODY_FPS * (lips?.bpm || 100) / 60);
  const k = onHit ? 1.25 : 1;
  const j = (i, amp) => jit(step, i, amp);  // boil: tiny per-frame wobble while holding
  poseBone("b_chest", 0, 0, pose.chest * k + j(1, 0.004));
  poseBone("b_neck", pose.neck[0] * k + j(2, 0.01), pose.neck[1] * k + j(3, 0.01), pose.neck[2] * k + j(4, 0.01));
  poseBone("b_head", pose.head[0] * k + j(5, 0.015), pose.head[1] * k + j(6, 0.015), pose.head[2] * k + j(7, 0.015));
  poseBone("b_forearm", pose.arm * k + j(8, 0.02), 0, j(9, 0.02));
  poseBone("b_hand", j(10, 0.03), 0, pose.hand * k + j(11, 0.04));

  const p = snowGeo.attributes.position;
  for (let i = 0; i < SNOW; i++) {
    let y = p.getY(i) - 0.035 - hash(i) * 0.03;
    if (y < 0) y += 1.2;
    p.setY(i, y);
    p.setX(i, p.getX(i) + jit(step, i, 0.004));
  }
  p.needsUpdate = true;
}

const _cam = new THREE.Vector3(), _eye = new THREE.Vector3(), _fwd = new THREE.Vector3(), _hq = new THREE.Quaternion();
const _lq = new THREE.Quaternion();
function stepFace(step, t, singing) {
  // mouth
  let jaw = 0, wide = 0, pucker = 0, smile = 0.15;
  if (singing && lips) {
    const f = lips.frames[Math.min(lips.frames.length - 1, Math.floor(song.currentTime * lips.fps))];
    [jaw, wide, pucker] = f;
    smile = 0.1;
  } else if (!singing) {
    smile = 0.2 + Math.max(0, Math.sin(t * 0.4)) * 0.4;
  }
  setMorph("jawOpen", jaw);
  setMorph("wide", wide);
  setMorph("pucker", pucker);
  setMorph("smile", smile);
  setMorph("frown", 0);
  setMorph("browsUp", singing ? jaw * 0.5 : Math.max(0, Math.sin(t * 0.3 + 2)) * 0.3);

  // blinks: closed for one face step every few seconds
  if (t > nextBlink) { blinkUntil = t + 1.5 / FACE_FPS; nextBlink = t + 2 + Math.random() * 4; }
  const b = t < blinkUntil ? 1 : 0;
  setMorph("blinkL", b);
  setMorph("blinkR", b);

  // eyes look at the camera, clamped: world-space rotation from "head forward" to "towards camera"
  camera.getWorldPosition(_cam);
  rig.bones.b_head.getWorldQuaternion(_hq);
  _fwd.set(0, 0, 1).applyQuaternion(_hq).applyQuaternion(rig.root.quaternion.clone().invert()).normalize();
  for (const n of ["b_eye_L", "b_eye_R"]) {
    const bn = rig.bones[n];
    bn.quaternion.copy(rig.rest[n]);
    bn.updateWorldMatrix(true, false);
    bn.getWorldPosition(_eye);
    const dir = _cam.clone().sub(_eye).normalize();
    _lq.setFromUnitVectors(_fwd, dir);
    const ang = 2 * Math.acos(Math.min(1, Math.abs(_lq.w)));
    const e = new THREE.Euler().setFromQuaternion(new THREE.Quaternion().slerp(_lq, ang > 0.45 ? 0.45 / ang : 1));
    poseBone(n, e.x, e.y, e.z);
  }
}

function frame(ms) {
  requestAnimationFrame(frame);
  const t = ms / 1000;

  // card follows cursor smoothly: the contrast with the choppy puppet is the point
  tilt.x += (tilt.tx - tilt.x) * 0.08;
  tilt.y += (tilt.ty - tilt.y) * 0.08;
  card.style.transform = `rotateY(${tilt.x * 14}deg) rotateX(${-tilt.y * 12}deg)`;
  card.style.setProperty("--gx", `${50 + tilt.x * 40}%`);
  card.style.setProperty("--gy", `${30 + tilt.y * 30}%`);

  if (rig.root) {
    // camera slides the other way: looking into a box, not at a sticker
    camera.position.set(rig.target.x - tilt.x * 0.35, rig.target.y + tilt.y * 0.25, rig.target.z + rig.dist);
    camera.lookAt(rig.target);
    camera.updateMatrixWorld();

    const singing = !song.paused;
    const clock = singing ? song.currentTime : t;
    const beat = lips?.bpm ? (song.currentTime - (lips.beat0 || 0)) * lips.bpm / 60 : clock * 100 / 60;

    const bs = Math.floor(clock * BODY_FPS);
    if (bs !== lastBody) { lastBody = bs; stepBody(bs, bs / BODY_FPS, singing, Math.floor(beat * 2) / 2); }
    const fs = Math.floor(clock * FACE_FPS);
    if (fs !== lastFace) { lastFace = fs; stepFace(fs, t, singing); }

    if (false) {
      const line = lips.lyrics.filter((l) => l.t <= song.currentTime).pop();
      lyricEl.textContent = line ? line.text : "";
    }
  }
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
