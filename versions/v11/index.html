<style>
  :root {

  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body {
    display: grid; place-items: center;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--fg);
  }
  body { background: radial-gradient(90% 70% at 50% 45%, #1c1e24 0%, var(--bg) 70%); }
  #glow {
    position: absolute; left: 50%; top: 55%; width: 190%; height: 125%;
    translate: calc(-50% + var(--glx, 0px)) calc(-50% + var(--gly, 0px));
    background: radial-gradient(closest-side, rgba(var(--glow), .95), rgba(var(--glow), .35) 50%, transparent);

    will-change: transform;

      linear-gradient(118deg, transparent calc(var(--g2, 55%) - 3%), rgba(255,255,255,.05) var(--g2, 55%), transparent calc(var(--g2, 55%) + 2.5%)),
      linear-gradient(106deg, transparent calc(var(--g3, 20%) - 22%), rgba(190,210,255,.03) var(--g3, 20%), transparent calc(var(--g3, 20%) + 20%)),

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

// body/head step rate; try ?fps=6 for hard stop-motion, ?fps=24 for smooth
// bumped on every deploy so a cached old asset never mixes with new code
const BUILD = "20260924101709";
const asset = (p) => `${p}?v=${BUILD}`;
const BODY_FPS = Math.max(2, Math.min(60, +new URLSearchParams(location.search).get("fps") || 12));
const FACE_FPS = 30;      // mouth and eyes
const LOW_RES = 260;      // internal render height, PS1-ish
const card = document.getElementById("card");
const tiltEl = document.getElementById("tilt");
const tab = document.getElementById("tab");
const tabInner = document.getElementById("tabinner");
const song = document.getElementById("song");
const lyricEl = document.getElementById("lyric");
// ?song=2 for the Russian track; song 1 (English) by default
const SONG = new URLSearchParams(location.search).get("song") === "2" ? 2 : 1;
song.src = asset(`song_${SONG}.mp3`);

const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
renderer.setPixelRatio(1);
card.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 2 / 3, 0.05, 20);

// --- PS1 vertex snapping: quantize clip-space positions to a coarse grid ---
const snapRes = { value: new THREE.Vector2(1, 1) };
function ps1Material(params) {
  const m = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide, ...params });
  m.onBeforeCompile = (sh) => {
    sh.uniforms.snapRes = snapRes;
    sh.vertexShader = "uniform vec2 snapRes;\n" + sh.vertexShader.replace(
      "#include <project_vertex>",
      `#include <project_vertex>
       gl_Position.xy = floor(gl_Position.xy / gl_Position.w * snapRes + 0.5) / snapRes * gl_Position.w;`);
  };
  return m;
}

const texLoader = new THREE.TextureLoader();
function tex(name) {
  const t = texLoader.load(asset(`tex_${name}.jpg`));
  t.colorSpace = THREE.SRGBColorSpace;
  t.magFilter = THREE.NearestFilter;
  t.minFilter = THREE.NearestFilter;
  t.generateMipmaps = false;
  t.flipY = false;
  return t;
}
const MATERIALS = {
  face: () => ps1Material({ map: tex("face") }),
  skull: () => ps1Material({ map: tex("face") }),
  beanie: () => ps1Material({ map: tex("beanie") }),
  clothes: () => ps1Material({ map: tex("clothes") }),
  hood: () => ps1Material({ map: tex("clothes") }),
  arm: () => ps1Material({ map: tex("clothes") }),
  hand: () => ps1Material({ map: tex("hand") }),
  eye_L: () => ps1Material({ map: tex("eyes") }),
  eye_R: () => ps1Material({ map: tex("eyes") }),
  mouth_in: () => ps1Material({ color: 0x170406 }),
  teeth: () => ps1Material({ color: 0xb9ad99 }),
};

// --- snow: tiny pixel-art flakes in two depth layers, falling in steps too ---
function flakeTexture() {
  const c = document.createElement("canvas");
  c.width = c.height = 5;
  const g = c.getContext("2d");
  g.fillStyle = "#fff";
  for (const [x, y] of [[2, 0], [2, 1], [0, 2], [1, 2], [2, 2], [3, 2], [4, 2], [2, 3], [2, 4]]) g.fillRect(x, y, 1, 1);
  g.fillStyle = "rgba(255,255,255,.45)";
  for (const [x, y] of [[1, 1], [3, 1], [1, 3], [3, 3]]) g.fillRect(x, y, 1, 1);
  const t = new THREE.CanvasTexture(c);
  t.magFilter = t.minFilter = THREE.NearestFilter;
  t.generateMipmaps = false;
  return t;
}
const FLAKE = flakeTexture();
const rnd = (a, b) => a + Math.random() * (b - a);
const snowLayers = [
  { n: 90, size: 0.018, speed: 0.022, z: [-0.55, -0.15], color: 0x9fb3d9 },  // far: small, slow, dimmer
  { n: 40, size: 0.032, speed: 0.05, z: [0.05, 0.3], color: 0xe8f0ff },      // near: big, fast
].map((L) => {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(L.n * 3);
  for (let i = 0; i < L.n; i++) pos.set([rnd(-0.6, 0.6), rnd(0, 1.2), rnd(...L.z)], i * 3);
  geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({
    map: FLAKE, color: L.color, size: L.size, sizeAttenuation: true, transparent: true, alphaTest: 0.2, depthWrite: false })));
  return { ...L, geo };
});

// --- character: skinned mesh driven by bones ---
const rig = {};
window.__rig = rig;  // debug handle for headless checks
const BONES = ["b_chest", "b_neck", "b_head", "b_eye_L", "b_eye_R", "b_forearm", "b_hand"];
new GLTFLoader().load(asset("me.glb"), (gltf) => {
  const root = gltf.scene;
  root.traverse((o) => {
    if (!o.isMesh) return;
    o.material = (MATERIALS[o.name] || MATERIALS.face)();
    o.frustumCulled = false;  // skinned bounds are stale once bones move
  });
  scene.add(root);
  root.updateMatrixWorld(true);

  // frame by the photo's width: the hand sits on the right edge of the card, the jacket on the bottom.
  // The photo is centered on x = 0 with its bottom at y = 0; its left edge is where the jacket starts.
  const halfW = -new THREE.Box3().setFromObject(root.getObjectByName("clothes")).min.x;
  const hoodBox = new THREE.Box3().setFromObject(root.getObjectByName("hood"));
  const viewW = halfW * 2 * 0.78;         // crop the photo sides a little, room for the tilt parallax
  const viewH = viewW * 1.5;              // card is 2:3
  const bottom = halfW * 0.12;            // photo bottom stays below the card edge
  rig.target = new THREE.Vector3(0, bottom + viewH / 2, hoodBox.getCenter(new THREE.Vector3()).z);
  rig.dist = (viewH / 2) / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));

  rig.bones = {};
  rig.rest = {};
  for (const n of BONES) {
    const bn = root.getObjectByName(n);
    rig.bones[n] = bn;
    rig.rest[n] = bn.quaternion.clone();
  }
  rig.face = root.getObjectByName("face");
  rig.morph = rig.face.morphTargetDictionary;
  rig.root = root;

// rotate a bone by an euler given in world axes (x = nod, y = turn, z = tilt), on top of its rest pose
const _pq = new THREE.Quaternion(), _dq = new THREE.Quaternion(), _e = new THREE.Euler();
function poseBone(name, x = 0, y = 0, z = 0) {
  const bn = rig.bones[name];
  bn.parent.updateWorldMatrix(true, false);
  bn.parent.getWorldQuaternion(_pq);
  _dq.setFromEuler(_e.set(x, y, z));
  // local = P^-1 * delta * P * rest
  bn.quaternion.copy(_pq).invert().multiply(_dq).multiply(_pq).multiply(rig.rest[name]);

function lerp(x, y, t) { return x + (y - x) * t; }

// Rhubarb / Preston Blair mouth shapes as mixes of the face shape keys
const VISEMES = {
  A: { mbp: 1 },                                                  // M B P
  B: { jawOpen: 0.2, wide: 0.22, upperUp: 0.2, smile: 0.08 },     // K S T, EE
  C: { jawOpen: 0.62, wide: 0.12, upperUp: 0.25 },                // EH AE
  D: { jawOpen: 1, wide: 0, upperUp: 0.15 },                      // AA
  E: { jawOpen: 0.65, pucker: 0.55 },                             // AO ER, "o"
  F: { jawOpen: 0.25, pucker: 1 },                                // UW OW W, "u"
  G: { jawOpen: 0.2, fv: 1, upperUp: 0.4 },                       // F V
  H: { jawOpen: 0.55, wide: 0.08, upperUp: 0.2 },                 // L
  X: { smile: 0.1 },                                              // rest
};
const MOUTH_KEYS = ["jawOpen", "wide", "pucker", "smile", "upperUp", "mbp", "fv"];
let cueIdx = 0;

function setMorph(name, v) {
  const i = rig.morph?.[name];
  if (i !== undefined) rig.face.morphTargetInfluences[i] = v;
}

// --- lip sync: baked visemes (from the separated vocal) + lyrics timing ---
let lips = null;
fetch(asset(`lipsync_${SONG}.json`)).then((r) => r.ok ? r.json() : null).then((d) => { lips = d; }).catch(() => {});

function toggleSong() {
  enableGyro();
  if (song.paused) {
    song.play().catch((err) => console.warn("play failed", err));
  } else song.pause();
}
card.addEventListener("click", () => { if (!drag.moved) toggleSong(); });  // a finger drag is not a tap
const pull = { active: false, d: 0, y0: 0, id: null, hover: false };
const PULL_TRIGGER = 42;
const TAB_REST = 38, TAB_HOVER = 46, TAB_HIDDEN = -4;  // px below the card's bottom edge
const rubber = (d) => 80 * (1 - Math.exp(-d / 80));  // the further you pull, the stiffer it gets
function releasePull() {
  const fired = pull.d > PULL_TRIGGER;
  pull.active = false;
  if (fired) { tabS.v = -1400; toggleSong(); }  // whoosh: flung back up into the card
  pull.d = 0;
}
tab.addEventListener("pointerdown", (e) => {
  pull.id = e.pointerId; pull.y0 = e.clientY; pull.d = 0; pull.active = true;
  tab.setPointerCapture(e.pointerId);
});
tab.addEventListener("pointermove", (e) => { if (e.pointerId === pull.id) pull.d = Math.max(0, e.clientY - pull.y0); });
tab.addEventListener("pointerup", (e) => {
  if (e.pointerId !== pull.id) return;
  pull.id = null;
  if (pull.d < 6) { pull.active = false; pull.d = 0; tabS.v = -500; toggleSong(); }  // plain tap
  else releasePull();
});
tab.addEventListener("pointercancel", () => { pull.id = null; pull.active = false; pull.d = 0; });
tab.addEventListener("pointerenter", () => { pull.hover = true; });
tab.addEventListener("pointerleave", () => { pull.hover = false; });
const tabS = spring(16, 0.42);
tabS.x = TAB_REST;
function updateTab(dt) {
  tabS.target = pull.active ? TAB_REST + rubber(pull.d)
    : !song.paused ? TAB_HIDDEN : pull.hover ? TAB_HOVER : TAB_REST;
  stepSpring(tabS, dt);
  // past the rest position it doesn't slide, it stretches: the top stays tucked under the card
  const h = tab.offsetHeight || 68;
  const extra = Math.max(0, tabS.x - TAB_REST);
  const stretch = (h + extra) / h;
  tab.style.transform = `translateY(${Math.min(tabS.x, TAB_REST).toFixed(1)}px) scaleY(${stretch.toFixed(3)})`;
  // keep the label unsquashed, riding at the bottom of the stretched tab
  tabInner.style.transform = `scaleY(${(1 / stretch).toFixed(3)})`;
}
const PLAY_ICON = "M1 0h1v8H1zM2 1h1v6H2zM3 1h1v6H3zM4 2h1v4H4zM5 3h1v2H5zM6 3h1v2H6z";
const PAUSE_ICON = "M1 1h2v6H1zM5 1h2v6H5z";
function syncPlaying(on) {
  tiltEl.classList.toggle("playing", on);
  card.classList.toggle("playing", on);
  document.getElementById("tabicon").setAttribute("d", on ? PAUSE_ICON : PLAY_ICON);
  document.getElementById("tablabel").textContent = on ? "pause" : "play";
  tab.setAttribute("aria-label", on ? "Pause" : "Play");
}
song.addEventListener("play", () => syncPlaying(true));
song.addEventListener("pause", () => syncPlaying(false));
song.addEventListener("ended", () => { syncPlaying(false); lyricEl.textContent = ""; });

// --- tilt: mouse on desktop; on phones the gyro, overridden by a finger drag ---
const tilt = { x: 0, y: 0, tx: 0, ty: 0 };
const clamp1 = (v) => Math.max(-1, Math.min(1, v));
addEventListener("pointermove", (e) => {
  if (e.pointerType !== "mouse") return;
  tilt.tx = (e.clientX / innerWidth - 0.5) * 2;
  tilt.ty = (e.clientY / innerHeight - 0.5) * 2;
});
document.addEventListener("pointerleave", () => { tilt.tx = tilt.ty = 0; });

const drag = { id: null, x0: 0, y0: 0, moved: false, until: 0, mode: null };
card.addEventListener("pointerdown", (e) => {
  if (e.pointerType === "mouse") return;
  drag.id = e.pointerId; drag.x0 = e.clientX; drag.y0 = e.clientY; drag.moved = false; drag.mode = null;
});
card.addEventListener("pointermove", (e) => {
  if (e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if (Math.hypot(dx, dy) > 14) drag.moved = true;
  if (!drag.moved) return;
  // a clearly downward swipe pulls the tab out of the card instead of tilting it
  if (!drag.mode) drag.mode = dy > 0 && dy > Math.abs(dx) * 1.5 && song.paused ? "pull" : "tilt";
  if (drag.mode === "pull") { pull.d = Math.max(0, dy); pull.active = true; return; }
  const r = card.getBoundingClientRect();
  tilt.tx = clamp1(((e.clientX - r.left) / r.width - 0.5) * 2.2);
  tilt.ty = clamp1(((e.clientY - r.top) / r.height - 0.5) * 2.2);
  drag.until = performance.now() + 1000;  // gyro takes over a second after release
});
const endDrag = (e) => {
  if (e.pointerId !== drag.id) return;
  drag.id = null;
  if (drag.mode === "pull") releasePull();
  setTimeout(() => { drag.moved = false; }, 0);  // let the click handler see it first

card.addEventListener("pointerup", endDrag);
card.addEventListener("pointercancel", endDrag);

// gyro: the card resists quick turns of the phone, then settles back to level.
// The reference ("level") slowly follows how the phone is held, so holding it at an angle
// doesn't keep the card tipped; a fast turn outruns the reference and tilts the card for a moment.
let gyroOn = false, gyroRaw = null, gyroRef = null;
const GYRO_SETTLE = 0.45;  // seconds for the reference to catch up: a turn shows, then fades
function onOrient(e) {

  gyroRaw = { b: e.beta, g: e.gamma };
  if (!gyroRef) gyroRef = { ...gyroRaw };
}
function updateGyro(dt) {
  if (!gyroRaw) return;
  const k = 1 - Math.exp(-dt / GYRO_SETTLE);
  gyroRef.b += (gyroRaw.b - gyroRef.b) * k;
  gyroRef.g += (gyroRaw.g - gyroRef.g) * k;
  if (drag.id !== null || performance.now() < drag.until) return;
  // inverted: the card keeps facing you while the phone turns away
  tilt.tx = clamp1(-(gyroRaw.g - gyroRef.g) / 25);
  tilt.ty = clamp1(-(gyroRaw.b - gyroRef.b) / 25);

  if (gyroOn || typeof DeviceOrientationEvent?.requestPermission !== "function") return;
  DeviceOrientationEvent.requestPermission().then((p) => { gyroOn = p === "granted"; }).catch(() => {});

// everywhere else events just arrive; on iOS nothing comes until permission is granted
addEventListener("deviceorientation", onOrient);
// re-center when the phone rotates between portrait and landscape
addEventListener("orientationchange", () => { gyroRef = null; gyroRaw = null; });

function resize() {
  const r = card.getBoundingClientRect();
  const h = LOW_RES, w = Math.round(LOW_RES * r.width / r.height);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  snapRes.value.set(w / 2, h / 2);
}
addEventListener("resize", resize);
resize();

// deterministic noise (snow drift)
function hash(n) { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); }
const jit = (step, k, amp) => (hash(step * 13.7 + k) - 0.5) * 2 * amp;

// --- motion: every channel is a damped spring chasing a target. The motion itself is smooth
// (inertia, a little overshoot, follow-through); only *showing* it is choppy: bones are written
// at BODY_FPS, the mouth at FACE_FPS. That is the stop-motion look without the twitching.
function spring(w, zeta) { return { x: 0, v: 0, target: 0, w, zeta }; }
function stepSpring(s, dt) {

  const n = Math.max(1, Math.ceil(dt * 240)), h = dt / n;
  for (let i = 0; i < n; i++) {
    s.v += (s.w * s.w * (s.target - s.x) - 2 * s.zeta * s.w * s.v) * h;

const S = {  // snappy: a new target is reached in 1-2 shown frames with a small overshoot, then held
  chest: spring(12, 0.5),

  head: [spring(24, 0.42), spring(24, 0.42), spring(24, 0.42)],
  arm: spring(16, 0.5),
  hand: spring(20, 0.38),

const ALL_BODY = [S.chest, ...S.neck, ...S.head, S.arm, S.hand];
const MS = Object.fromEntries(MOUTH_KEYS.map((k) => [k, spring(95, 1)]));  // ~15 ms: shapes swap, no jelly

let lastBody = -1, lastFace = -1, lastPose = -1, blinkUntil = 0, nextBlink = 2;
let beatIdx = -1, beatPart = -1, lastSongT = 0;

// --- choreography on the beat grid (half-time for DnB) ---
// Every 4 bars the dance changes, like verses: nods, side-to-side, looking around, double-time bounce.
// Moves land on the beat (snap + hold); everything is symmetric around neutral.
function T(o) {

  if (o.neck) o.neck.forEach((v, i) => { if (v !== null) S.neck[i].target = v; });
  if (o.chest !== undefined) S.chest.target = o.chest;
  if (o.hand !== undefined) S.hand.target = o.hand;

const PATTERNS = {
  nod: (k, q, part) => {
    if (part === 0) T({ head: [0.13, (k >> 2) & 1 ? 0.07 : -0.07, 0], neck: [0.04, null, 0], chest: 0 });
    if (part === 2) T({ head: [-0.02, null, null], neck: [0, null, null] });

  side: (k, q, part) => {
    const side = q % 2 ? 1 : -1;
    if (part === 0) T({ head: [0.04, 0.07 * side, 0.13 * side], neck: [0, 0.02 * side, 0.05 * side], chest: 0.02 * side });
    if (part === 2) T({ head: [0, null, null] });
  },
  look: (k, q, part) => {
    if (part === 0 && q % 2 === 0) {
      const dir = [0.24, 0, -0.24, 0][(k >> 1) & 3];
      T({ head: [0.08, dir, -dir * 0.2], neck: [0, dir * 0.4, 0] });
    } else if (part === 0) T({ head: [0.06, null, null] });
    if (part === 2) T({ head: [0, null, null] });
  },
  bounce: (k, q, part) => {  // double time: down on every half beat
    if (part === 0 || part === 2) T({ head: [0.1, null, 0], neck: [0.03, null, null], chest: part === 0 ? 0.03 : -0.03 });
    if (part === 1 || part === 3) T({ head: [-0.01, null, null], neck: [0, null, null] });
  },
};
const ORDER = ["nod", "side", "nod", "look", "bounce", "side", "look", "bounce"];

function danceStep(k, part) {
  const q = ((k % 4) + 4) % 4;
  const phrase = Math.floor(k / 16);
  PATTERNS[ORDER[((phrase % ORDER.length) + ORDER.length) % ORDER.length]](k, q, part);
  // the hand pumps on the backbeat (2 and 4), like a clap
  if (part === 0) T(q % 2 ? { hand: 0.4, arm: 0.1 } : { hand: -0.05, arm: 0 });
  if (part === 2) T({ hand: 0.05, arm: 0 });
}

// fire beat parts (0 = on the beat, 1/2/3 = quarter subdivisions) as the song crosses them
// moves start one shown frame early, so the pose *lands* on the beat instead of trailing it
const LEAD = 1 / BODY_FPS;
function dance() {
  const now = song.currentTime + LEAD, B = lips.beats;
  if (!B || !B.length) return false;
  if (now < lastSongT - 0.2) { beatIdx = -1; beatPart = -1; }  // seek / restart
  lastSongT = now;
  if (now < B[0] || now > B[B.length - 1] + 1) return false;  // no grid: let idle take over
  let i = Math.max(0, beatIdx);
  while (i + 1 < B.length && B[i + 1] <= now) i++;
  const period = (B[Math.min(i + 1, B.length - 1)] - B[i]) || 0.7;
  const part = Math.min(3, Math.floor(((now - B[i]) / period) * 4));
  if (i !== beatIdx || part !== beatPart) {
    beatIdx = i;
    beatPart = part;
    danceStep(i - (lips.bar0 || 0), part);
    if (window.__danceLog) window.__danceLog.push([now, B[i] + part * period / 4]);  // headless timing check
  }
  return true;
}

// key poses: [head xyz, neck xyz, chest z, hand z, forearm x]
const POSES = [
  { head: [0.04, 0.16, 0.07], neck: [0.02, 0.07, 0.02], chest: 0.025, hand: 0.25, arm: 0.05 },
  { head: [-0.05, -0.14, -0.08], neck: [0.00, -0.08, -0.03], chest: -0.03, hand: -0.2, arm: -0.05 },
  { head: [0.10, 0.03, 0.11], neck: [0.04, 0.01, 0.03], chest: 0.03, hand: 0.4, arm: 0.1 },
  { head: [-0.02, 0.22, -0.05], neck: [0.00, 0.09, -0.01], chest: 0.0, hand: 0.05, arm: -0.08 },
  { head: [0.07, -0.2, 0.03], neck: [0.03, -0.07, 0.01], chest: -0.02, hand: -0.3, arm: 0.07 },
  { head: [-0.07, 0.0, 0.14], neck: [-0.02, 0.0, 0.05], chest: 0.04, hand: 0.3, arm: 0.0 },
];
const IDLE_POSES = [
  { head: [0.015, 0.07, 0.03], neck: [0, 0.03, 0.01], chest: 0.01, hand: 0.1, arm: 0 },
  { head: [-0.02, -0.06, -0.025], neck: [0, -0.02, -0.01], chest: -0.01, hand: -0.05, arm: 0.03 },
  { head: [0.025, 0.015, 0.05], neck: [0.01, 0.01, 0.015], chest: 0.0, hand: 0.18, arm: -0.02 },
];
function poseAt(set, idx) { return set[Math.floor(hash(idx * 7.3) * set.length)]; }

function setBodyTargets(pose) {
  S.chest.target = pose.chest;
  pose.neck.forEach((v, i) => { S.neck[i].target = v; });
  pose.head.forEach((v, i) => { S.head[i].target = v; });
  S.arm.target = pose.arm;
  S.hand.target = pose.hand;
}

function writeBones() {
  poseBone("b_chest", 0, 0, S.chest.x);
  poseBone("b_neck", S.neck[0].x, S.neck[1].x, S.neck[2].x);
  poseBone("b_head", S.head[0].x, S.head[1].x, S.head[2].x);
  poseBone("b_forearm", S.arm.x, 0, 0);
  poseBone("b_hand", 0, 0, S.hand.x);
}

function stepSnow(step) {
  for (const L of snowLayers) {
    const p = L.geo.attributes.position;
    for (let i = 0; i < L.n; i++) {
      let y = p.getY(i) - (L.speed + hash(i) * L.speed * 0.8) * 6 / BODY_FPS;
      if (y < 0) y += 1.2;
      p.setY(i, y);
      p.setX(i, p.getX(i) + jit(step, i + L.n, 0.004 * 6 / BODY_FPS));
    }
    p.needsUpdate = true;
  }
}

// the mouth moves ~60 ms ahead of the sound: animators' rule, it reads as dead on
const MOUTH_LEAD = 0.06;
function mouthTargets(t, singing) {
  // jaw = the fast vowel envelope (every syllable its own opening); Rhubarb only shapes the lips
  let m = { ...VISEMES.X, smile: 0.12 + Math.max(0, Math.sin(t * 0.4)) * 0.3 };
  if (singing && lips) {
    const now = song.currentTime + MOUTH_LEAD;
    const f = lips.frames[Math.max(0, Math.min(lips.frames.length - 1, Math.floor(now * lips.fps)))];
    const env = f[0];
    if (lips.cues) {
      let i = cueIdx;
      if (i >= lips.cues.length || lips.cues[i][0] > now) i = 0;  // seek / restart
      while (i + 1 < lips.cues.length && lips.cues[i + 1][0] <= now) i++;
      cueIdx = i;
      m = env < 0.05 ? { ...VISEMES.X, smile: 0 } : { ...(VISEMES[lips.cues[i][1]] || VISEMES.X) };
    } else {
      m = { wide: f[1] * 0.5, pucker: f[2], smile: 0.05 };
    }
    const closed = (m.mbp || 0) > 0.5;
    m.jawOpen = closed ? env * 0.2 : Math.min(1, env * (0.75 + 0.5 * (m.jawOpen || 0)));
  }
  for (const k of MOUTH_KEYS) MS[k].target = m[k] || 0;
}

const _cam = new THREE.Vector3(), _eye = new THREE.Vector3(), _fwd = new THREE.Vector3(), _hq = new THREE.Quaternion();
const _lq = new THREE.Quaternion();
function writeFace(t, singing) {
  for (const k of MOUTH_KEYS) setMorph(k, Math.max(0, MS[k].x));
  setMorph("frown", 0);
  setMorph("browsUp", singing ? Math.max(0, MS.jawOpen.x) * 0.5 : Math.max(0, Math.sin(t * 0.3 + 2)) * 0.3);

  // blinks: closed for ~0.1s every few seconds
  if (t > nextBlink) { blinkUntil = t + 0.1; nextBlink = t + 2 + Math.random() * 4; }
  const b = t < blinkUntil ? 1 : 0;
  setMorph("blinkL", b);
  setMorph("blinkR", b);

  // eyes look at the camera, clamped: world-space rotation from "head forward" to "towards camera"
  camera.getWorldPosition(_cam);
  rig.bones.b_head.getWorldQuaternion(_hq);
  _fwd.set(0, 0, 1).applyQuaternion(_hq).applyQuaternion(rig.root.quaternion.clone().invert()).normalize();
  for (const n of ["b_eye_L", "b_eye_R"]) {
    const bn = rig.bones[n];
    bn.quaternion.copy(rig.rest[n]);
    bn.updateWorldMatrix(true, false);
    bn.getWorldPosition(_eye);
    const dir = _cam.clone().sub(_eye).normalize();
    _lq.setFromUnitVectors(_fwd, dir);
    const ang = 2 * Math.acos(Math.min(1, Math.abs(_lq.w)));
    const e = new THREE.Euler().setFromQuaternion(new THREE.Quaternion().slerp(_lq, ang > 0.45 ? 0.45 / ang : 1));
    poseBone(n, e.x, e.y, e.z);
  }
}

let lastMs = 0;
const cardS = { x: spring(11, 0.55), y: spring(11, 0.55) };  // quick, barely any wobble
function frame(ms) {
  requestAnimationFrame(frame);
  const t = ms / 1000;
  const dt = Math.min(1 / 30, Math.max(0, (ms - lastMs) / 1000));
  lastMs = ms;

  updateGyro(dt);
  updateTab(dt);
  // card follows the pointer / phone smoothly: the contrast with the stepped puppet is the point
  cardS.x.target = tilt.tx; cardS.y.target = tilt.ty;
  stepSpring(cardS.x, dt); stepSpring(cardS.y, dt);
  tilt.x = cardS.x.x; tilt.y = cardS.y.x;
  tiltEl.style.transform = `rotateY(${tilt.x * 8}deg) rotateX(${-tilt.y * 7}deg)`;
  card.style.setProperty("--g1", `${35 + tilt.x * 40 + tilt.y * 8}%`);
  card.style.setProperty("--g2", `${58 + tilt.x * 75 - tilt.y * 12}%`);
  card.style.setProperty("--g3", `${22 + tilt.x * 22 + tilt.y * 18}%`);
  const stage = tiltEl.parentElement;
  stage.style.setProperty("--glx", `${-tilt.x * 24}px`);
  stage.style.setProperty("--gly", `${-tilt.y * 18 + 10}px`);
  let pulse = 0.5 + 0.08 * Math.sin(t * 1.3);
  if (!song.paused) {
    const bf = ((song.currentTime - (lips?.beat0 || 0)) * (lips?.bpm || 100) / 60) % 1;
    pulse = 0.45 + 0.55 * Math.exp(-Math.max(0, bf) * 5);
  }
  stage.style.setProperty("--pulse", pulse.toFixed(3));

  if (rig.root) {
    // camera slides the other way: looking into a box, not at a sticker
    camera.position.set(rig.target.x - tilt.x * 0.22, rig.target.y + tilt.y * 0.13, rig.target.z + rig.dist);
    camera.lookAt(rig.target);
    camera.updateMatrixWorld();

    const singing = !song.paused;
    const clock = singing ? song.currentTime : t;

    // new key pose on every beat while singing, every 1.6s idle; springs carry the body there
    const dancing = singing && lips && dance();
    if (!dancing) {  // idle: small relaxed poses every 1.6s
      const poseIdx = Math.floor(t / 1.6);
      if (poseIdx !== lastPose) { lastPose = poseIdx; setBodyTargets(poseAt(IDLE_POSES, poseIdx)); }
    } else lastPose = -1;
    mouthTargets(t, singing);
    for (const s_ of ALL_BODY) stepSpring(s_, dt);
    for (const k of MOUTH_KEYS) stepSpring(MS[k], dt);

    // ...but only show it on the step grid; while dancing the grid restarts on every beat
    const bs = dancing
      ? beatIdx * 1000 + Math.floor((song.currentTime + LEAD - lips.beats[beatIdx]) * BODY_FPS)
      : Math.floor(clock * BODY_FPS);
    if (bs !== lastBody) { lastBody = bs; writeBones(); stepSnow(bs); }
    const fs = Math.floor(clock * FACE_FPS);
    if (fs !== lastFace) { lastFace = fs; writeFace(t, singing); }
  }
  renderer.render(scene, camera);
}
window.__three = { renderer, scene, camera, S, MS };
requestAnimationFrame(frame);
</script>
</body>
