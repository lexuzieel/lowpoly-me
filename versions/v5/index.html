<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Low-poly me</title>
<style>
  :root {
    --bg: #141519;
    --glow: 72, 112, 210;
    --fg: #cfd3dc;
    --card-w: min(380px, calc(100vw - 32px));
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body {
    display: grid; place-items: center;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--fg);
  }
  body { background: radial-gradient(90% 70% at 50% 45%, #1c1e24 0%, var(--bg) 70%); }
  #glow {
    position: absolute; left: 50%; top: 55%; width: 190%; height: 125%;
    translate: calc(-50% + var(--glx, 0px)) calc(-50% + var(--gly, 0px));
    background: radial-gradient(closest-side, rgba(var(--glow), .95), rgba(var(--glow), .35) 50%, transparent);
    filter: blur(40px); opacity: var(--pulse, .5);
    pointer-events: none;
  }
  #stage { perspective: 1000px; position: relative; }
  #card {
    width: var(--card-w); aspect-ratio: 2 / 3;
    border-radius: 18px; overflow: hidden; position: relative; cursor: pointer;
    background: radial-gradient(120% 80% at 50% 20%, #1b2233 0%, #0b0d14 70%);
    box-shadow: 0 30px 80px rgba(0,0,0,.55);
    outline: 1px solid rgba(255,255,255,.09); outline-offset: -1px;
    will-change: transform;
    user-select: none; -webkit-user-select: none;
    touch-action: none;  /* finger drags tilt the card instead of scrolling */
    -webkit-tap-highlight-color: transparent;
  }
  #card canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    image-rendering: pixelated;
    border-radius: inherit;
  }
  #glare {
    position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; border-radius: inherit;
    background: radial-gradient(60% 45% at var(--gx, 50%) var(--gy, 30%), rgba(255,255,255,.14), transparent 70%);
  }
  #label {
    position: absolute; left: 16px; right: 16px; bottom: 14px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    pointer-events: none;
  }
  #label span { opacity: .7; }
  #play {
    position: absolute; left: 50%; bottom: 12px; translate: -50% 0;
    width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(8, 10, 16, .62);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: opacity .25s, scale .25s; pointer-events: none;
  }
  #play svg { width: 20px; height: 20px; margin-left: 3px; fill: var(--fg); shape-rendering: crispEdges; }
  #card.playing #play { opacity: 0; scale: .85; }
  #card:not(.playing):hover #play { scale: 1.06; }
  #lyric {
    position: absolute; left: 16px; right: 16px; top: 16px; text-align: center;
    font-size: 12px; line-height: 1.4; min-height: 1.4em; opacity: .85;
    text-shadow: 0 1px 2px #000; pointer-events: none;
  }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage">
  <div id="glow"></div>
  <div id="card">
    <div id="glare"></div>
    <div id="lyric"></div>
    <div id="play"><svg viewBox="0 0 8 8"><path d="M1 0h1v8H1zM2 1h1v6H2zM3 1h1v6H3zM4 2h1v4H4zM5 3h1v2H5zM6 3h1v2H6z"/></svg></div>
    <div id="label"><span>low-poly me</span></div>
  </div>
</div>
<audio id="song" src="song.mp3" preload="auto"></audio>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

// body/head step rate; try ?fps=6 for hard stop-motion, ?fps=24 for smooth
const BODY_FPS = Math.max(2, Math.min(60, +new URLSearchParams(location.search).get("fps") || 12));
const FACE_FPS = 12;      // mouth and eyes "on twos"
const LOW_RES = 260;      // internal render height, PS1-ish
const card = document.getElementById("card");
const song = document.getElementById("song");
const lyricEl = document.getElementById("lyric");

const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
renderer.setPixelRatio(1);
card.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 2 / 3, 0.05, 20);

// --- PS1 vertex snapping: quantize clip-space positions to a coarse grid ---
const snapRes = { value: new THREE.Vector2(1, 1) };
function ps1Material(params) {
  const m = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide, ...params });
  m.onBeforeCompile = (sh) => {
    sh.uniforms.snapRes = snapRes;
    sh.vertexShader = "uniform vec2 snapRes;\n" + sh.vertexShader.replace(
      "#include <project_vertex>",
      `#include <project_vertex>
       gl_Position.xy = floor(gl_Position.xy / gl_Position.w * snapRes + 0.5) / snapRes * gl_Position.w;`);
  };
  return m;
}

const texLoader = new THREE.TextureLoader();
function tex(name) {
  const t = texLoader.load(`tex_${name}.jpg`);
  t.colorSpace = THREE.SRGBColorSpace;
  t.magFilter = THREE.NearestFilter;
  t.minFilter = THREE.NearestFilter;
  t.generateMipmaps = false;
  t.flipY = false;
  return t;
}
const MATERIALS = {
  face: () => ps1Material({ map: tex("face") }),
  skull: () => ps1Material({ map: tex("face") }),
  beanie: () => ps1Material({ map: tex("beanie") }),
  clothes: () => ps1Material({ map: tex("clothes") }),
  hood: () => ps1Material({ map: tex("clothes") }),
  arm: () => ps1Material({ map: tex("clothes") }),
  hand: () => ps1Material({ map: tex("hand") }),
  eye_L: () => ps1Material({ map: tex("eyes") }),
  eye_R: () => ps1Material({ map: tex("eyes") }),
  mouth_in: () => ps1Material({ color: 0x170406 }),
  teeth: () => ps1Material({ color: 0xb9ad99 }),
};

// --- snow: falls in steps too ---
const SNOW = 140;
const snowGeo = new THREE.BufferGeometry();
const snowPos = new Float32Array(SNOW * 3);
const rnd = (a, b) => a + Math.random() * (b - a);
for (let i = 0; i < SNOW; i++) snowPos.set([rnd(-0.6, 0.6), rnd(0, 1.2), rnd(-0.5, 0.25)], i * 3);
snowGeo.setAttribute("position", new THREE.BufferAttribute(snowPos, 3));
scene.add(new THREE.Points(snowGeo, new THREE.PointsMaterial({ color: 0xdde6ff, size: 3, sizeAttenuation: false })));

// --- character: skinned mesh driven by bones ---
const rig = {};
const BONES = ["b_chest", "b_neck", "b_head", "b_eye_L", "b_eye_R", "b_forearm", "b_hand"];
new GLTFLoader().load("me.glb", (gltf) => {
  const root = gltf.scene;
  root.traverse((o) => {
    if (!o.isMesh) return;
    o.material = (MATERIALS[o.name] || MATERIALS.face)();
    o.frustumCulled = false;  // skinned bounds are stale once bones move
  });
  scene.add(root);
  root.updateMatrixWorld(true);

  // frame on hood + chest; the forearm runs out of the shot on purpose
  const box = new THREE.Box3().setFromObject(root.getObjectByName("hood"));
  box.expandByObject(root.getObjectByName("hand"));
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());

  rig.bones = {};
  rig.rest = {};
  for (const n of BONES) {
    const bn = root.getObjectByName(n);
    rig.bones[n] = bn;
    rig.rest[n] = bn.quaternion.clone();
  }
  rig.face = root.getObjectByName("face");
  rig.morph = rig.face.morphTargetDictionary;
  rig.root = root;
  rig.target = new THREE.Vector3(center.x, center.y + size.y * 0.03, center.z);
  rig.dist = size.y * 2.25;
});

// rotate a bone by an euler given in world axes (x = nod, y = turn, z = tilt), on top of its rest pose
const _pq = new THREE.Quaternion(), _dq = new THREE.Quaternion(), _e = new THREE.Euler();
function poseBone(name, x = 0, y = 0, z = 0) {
  const bn = rig.bones[name];
  bn.parent.updateWorldMatrix(true, false);
  bn.parent.getWorldQuaternion(_pq);
  _dq.setFromEuler(_e.set(x, y, z));
  // local = P^-1 * delta * P * rest
  bn.quaternion.copy(_pq).invert().multiply(_dq).multiply(_pq).multiply(rig.rest[name]);
}

function setMorph(name, v) {
  const i = rig.morph?.[name];
  if (i !== undefined) rig.face.morphTargetInfluences[i] = v;
}

// --- lip sync: baked visemes (from the separated vocal) + lyrics timing ---
let lips = null;
fetch("lipsync.json").then((r) => r.ok ? r.json() : null).then((d) => { lips = d; }).catch(() => {});

card.addEventListener("click", () => {
  if (drag.moved) return;  // a finger drag is not a tap
  enableGyro();
  if (song.paused) {
    song.play().catch((err) => console.warn("play failed", err));
  } else song.pause();
});
song.addEventListener("play", () => card.classList.add("playing"));
song.addEventListener("pause", () => card.classList.remove("playing"));
song.addEventListener("ended", () => { card.classList.remove("playing"); lyricEl.textContent = ""; });

// --- tilt: mouse on desktop; on phones the gyro, overridden by a finger drag ---
const tilt = { x: 0, y: 0, tx: 0, ty: 0 };
const clamp1 = (v) => Math.max(-1, Math.min(1, v));
addEventListener("pointermove", (e) => {
  if (e.pointerType !== "mouse") return;
  tilt.tx = (e.clientX / innerWidth - 0.5) * 2;
  tilt.ty = (e.clientY / innerHeight - 0.5) * 2;
});
document.addEventListener("pointerleave", () => { tilt.tx = tilt.ty = 0; });

const drag = { id: null, x0: 0, y0: 0, moved: false, until: 0 };
card.addEventListener("pointerdown", (e) => {
  if (e.pointerType === "mouse") return;
  drag.id = e.pointerId; drag.x0 = e.clientX; drag.y0 = e.clientY; drag.moved = false;
});
card.addEventListener("pointermove", (e) => {
  if (e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if (Math.hypot(dx, dy) > 14) drag.moved = true;
  if (!drag.moved) return;
  const r = card.getBoundingClientRect();
  tilt.tx = clamp1(((e.clientX - r.left) / r.width - 0.5) * 2.2);
  tilt.ty = clamp1(((e.clientY - r.top) / r.height - 0.5) * 2.2);
  drag.until = performance.now() + 1000;  // gyro takes over a second after release
});
const endDrag = (e) => {
  if (e.pointerId !== drag.id) return;
  drag.id = null;
  setTimeout(() => { drag.moved = false; }, 0);  // let the click handler see it first
};
card.addEventListener("pointerup", endDrag);
card.addEventListener("pointercancel", endDrag);

// gyro: relative to how the phone was held when it started, +-25 degrees = full tilt
let gyroBase = null, gyroOn = false;
function onOrient(e) {
  if (e.beta == null || e.gamma == null) return;
  if (!gyroBase) gyroBase = { b: e.beta, g: e.gamma };
  if (drag.id !== null || performance.now() < drag.until) return;
  // inverted: the card turns its face back toward you as the phone tilts away
  tilt.tx = clamp1(-(e.gamma - gyroBase.g) / 25);
  tilt.ty = clamp1(-(e.beta - gyroBase.b) / 25);
}
function enableGyro() {
  // iOS: sensor events only flow after permission, which needs a user gesture (the first tap)
  if (gyroOn || typeof DeviceOrientationEvent?.requestPermission !== "function") return;
  DeviceOrientationEvent.requestPermission().then((p) => { gyroOn = p === "granted"; }).catch(() => {});
}
// everywhere else events just arrive; on iOS nothing comes until permission is granted
addEventListener("deviceorientation", onOrient);
// re-center when the phone rotates between portrait and landscape
addEventListener("orientationchange", () => { gyroBase = null; });

function resize() {
  const r = card.getBoundingClientRect();
  const h = LOW_RES, w = Math.round(LOW_RES * r.width / r.height);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  snapRes.value.set(w / 2, h / 2);
}
addEventListener("resize", resize);
resize();

// deterministic per-step noise, so every "frame" of the stop-motion holds still
function hash(n) { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); }
const jit = (step, k, amp) => (hash(step * 13.7 + k) - 0.5) * 2 * amp;

let lastBody = -1, lastFace = -1, blinkUntil = 0, nextBlink = 2;
const tmpV = new THREE.Vector3(), tmpQ = new THREE.Quaternion(), tmpM = new THREE.Matrix4();

// key poses for pose-to-pose stop motion: [head xyz, neck xyz, chest z, hand z, forearm x]
const POSES = [
  { head: [0.025, 0.125, 0.050], neck: [0.012, 0.060, 0.018], chest: 0.02, hand: 0.25, arm: 0.05 },
  { head: [-0.040, -0.100, -0.060], neck: [0.000, -0.072, -0.024], chest: -0.03, hand: -0.20, arm: -0.05 },
  { head: [0.075, 0.025, 0.090], neck: [0.036, 0.012, 0.030], chest: 0.03, hand: 0.45, arm: 0.12 },
  { head: [-0.010, 0.175, -0.040], neck: [0.000, 0.084, -0.012], chest: 0.00, hand: 0.05, arm: -0.10 },
  { head: [0.050, -0.150, 0.025], neck: [0.024, -0.060, 0.012], chest: -0.02, hand: -0.35, arm: 0.08 },
  { head: [-0.060, 0.000, 0.110], neck: [-0.018, 0.000, 0.048], chest: 0.04, hand: 0.30, arm: 0.00 },
];
const IDLE_POSES = [
  { head: [0.010, 0.050, 0.025], neck: [0.000, 0.024, 0.006], chest: 0.01, hand: 0.10, arm: 0 },
  { head: [-0.015, -0.040, -0.020], neck: [0.000, -0.018, -0.006], chest: -0.01, hand: -0.05, arm: 0.03 },
  { head: [0.020, 0.010, 0.040], neck: [0.006, 0.006, 0.012], chest: 0.0, hand: 0.18, arm: -0.02 },
];

const lerp = (x, y, t) => x + (y - x) * t;
function poseAt(set, idx) { return set[Math.floor(hash(idx * 7.3) * set.length)]; }
function mixPose(p, q, t) {
  return {
    head: p.head.map((v, i) => lerp(v, q.head[i], t)),
    neck: p.neck.map((v, i) => lerp(v, q.neck[i], t)),
    chest: lerp(p.chest, q.chest, t), hand: lerp(p.hand, q.hand, t), arm: lerp(p.arm, q.arm, t),
  };
}

function stepBody(step, ts, singing, beat) {
  // pose-to-pose: a new key pose each beat (singing) or every ~1.3s (idle);
  // it arrives fast with an ease-out over the first third of the segment, then holds
  const phase = singing ? beat : ts / 1.3;
  const idx = Math.floor(phase), frac = phase - idx;
  const set = singing ? POSES : IDLE_POSES;
  const e = 1 - Math.pow(1 - Math.min(1, frac / 0.33), 3);
  const pose = mixPose(poseAt(set, idx - 1), poseAt(set, idx), e);
  const k = singing ? 1 + 0.12 * Math.sin(Math.min(1, frac / 0.33) * Math.PI) : 1;  // small overshoot on arrival
  const j = (i, amp) => jit(step, i, amp * 6 / BODY_FPS);  // boil: wobble per frame, gentler at higher fps
  poseBone("b_chest", 0, 0, pose.chest * k + j(1, 0.004));
  poseBone("b_neck", pose.neck[0] * k + j(2, 0.01), pose.neck[1] * k + j(3, 0.01), pose.neck[2] * k + j(4, 0.01));
  poseBone("b_head", pose.head[0] * k + j(5, 0.015), pose.head[1] * k + j(6, 0.015), pose.head[2] * k + j(7, 0.015));
  poseBone("b_forearm", pose.arm * k + j(8, 0.02), 0, j(9, 0.02));
  poseBone("b_hand", j(10, 0.03), 0, pose.hand * k + j(11, 0.04));

  const p = snowGeo.attributes.position;
  for (let i = 0; i < SNOW; i++) {
    let y = p.getY(i) - (0.035 + hash(i) * 0.03) * 6 / BODY_FPS;
    if (y < 0) y += 1.2;
    p.setY(i, y);
    p.setX(i, p.getX(i) + jit(step, i, 0.004 * 6 / BODY_FPS));
  }
  p.needsUpdate = true;
}

const _cam = new THREE.Vector3(), _eye = new THREE.Vector3(), _fwd = new THREE.Vector3(), _hq = new THREE.Quaternion();
const _lq = new THREE.Quaternion();
function stepFace(step, t, singing) {
  // mouth
  let jaw = 0, wide = 0, pucker = 0, smile = 0.15;
  if (singing && lips) {
    const f = lips.frames[Math.min(lips.frames.length - 1, Math.floor(song.currentTime * lips.fps))];
    [jaw, wide, pucker] = f;
    smile = 0.1;
  } else if (!singing) {
    smile = 0.2 + Math.max(0, Math.sin(t * 0.4)) * 0.4;
  }
  setMorph("jawOpen", jaw);
  setMorph("wide", wide);
  setMorph("pucker", pucker);
  setMorph("smile", smile);
  setMorph("frown", 0);
  setMorph("browsUp", singing ? jaw * 0.5 : Math.max(0, Math.sin(t * 0.3 + 2)) * 0.3);

  // blinks: closed for one face step every few seconds
  if (t > nextBlink) { blinkUntil = t + 1.5 / FACE_FPS; nextBlink = t + 2 + Math.random() * 4; }
  const b = t < blinkUntil ? 1 : 0;
  setMorph("blinkL", b);
  setMorph("blinkR", b);

  // eyes look at the camera, clamped: world-space rotation from "head forward" to "towards camera"
  camera.getWorldPosition(_cam);
  rig.bones.b_head.getWorldQuaternion(_hq);
  _fwd.set(0, 0, 1).applyQuaternion(_hq).applyQuaternion(rig.root.quaternion.clone().invert()).normalize();
  for (const n of ["b_eye_L", "b_eye_R"]) {
    const bn = rig.bones[n];
    bn.quaternion.copy(rig.rest[n]);
    bn.updateWorldMatrix(true, false);
    bn.getWorldPosition(_eye);
    const dir = _cam.clone().sub(_eye).normalize();
    _lq.setFromUnitVectors(_fwd, dir);
    const ang = 2 * Math.acos(Math.min(1, Math.abs(_lq.w)));
    const e = new THREE.Euler().setFromQuaternion(new THREE.Quaternion().slerp(_lq, ang > 0.45 ? 0.45 / ang : 1));
    poseBone(n, e.x, e.y, e.z);
  }
}

function frame(ms) {
  requestAnimationFrame(frame);
  const t = ms / 1000;

  // card follows cursor smoothly: the contrast with the choppy puppet is the point
  tilt.x += (tilt.tx - tilt.x) * 0.08;
  tilt.y += (tilt.ty - tilt.y) * 0.08;
  card.style.transform = `rotateY(${tilt.x * 14}deg) rotateX(${-tilt.y * 12}deg)`;
  card.style.setProperty("--gx", `${50 + tilt.x * 40}%`);
  card.style.setProperty("--gy", `${30 + tilt.y * 30}%`);
  const stage = card.parentElement;
  stage.style.setProperty("--glx", `${-tilt.x * 24}px`);
  stage.style.setProperty("--gly", `${-tilt.y * 18 + 10}px`);
  let pulse = 0.5 + 0.08 * Math.sin(t * 1.3);
  if (!song.paused) {
    const bf = ((song.currentTime - (lips?.beat0 || 0)) * (lips?.bpm || 100) / 60) % 1;
    pulse = 0.45 + 0.55 * Math.exp(-Math.max(0, bf) * 5);
  }
  stage.style.setProperty("--pulse", pulse.toFixed(3));

  if (rig.root) {
    // camera slides the other way: looking into a box, not at a sticker
    camera.position.set(rig.target.x - tilt.x * 0.35, rig.target.y + tilt.y * 0.25, rig.target.z + rig.dist);
    camera.lookAt(rig.target);
    camera.updateMatrixWorld();

    const singing = !song.paused;
    const clock = singing ? song.currentTime : t;
    const beat = lips?.bpm ? (song.currentTime - (lips.beat0 || 0)) * lips.bpm / 60 : clock * 100 / 60;

    const bs = Math.floor(clock * BODY_FPS);
    if (bs !== lastBody) { lastBody = bs; stepBody(bs, bs / BODY_FPS, singing, Math.floor(beat * BODY_FPS * 60 / (lips?.bpm || 100)) / (BODY_FPS * 60 / (lips?.bpm || 100))); }
    const fs = Math.floor(clock * FACE_FPS);
    if (fs !== lastFace) { lastFace = fs; stepFace(fs, t, singing); }

    if (false) {
      const line = lips.lyrics.filter((l) => l.t <= song.currentTime).pop();
      lyricEl.textContent = line ? line.text : "";
    }
  }
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
